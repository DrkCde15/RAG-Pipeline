services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      DATA_DIR: /app/data/raw
      PROCESSED_DIR: /app/data/processed
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - model-cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks: [rag]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 2 bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [rag]

  ollama:
    image: ollama/ollama:0.5.7
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [rag]

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    env_file: .env
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PARALLELISM: "${AIRFLOW_PARALLELISM:-2}"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /opt/airflow/data/raw
      PROCESSED_DIR: /opt/airflow/data/processed
    command:
      - bash
      - -c
      - airflow db migrate && (airflow users list | grep -q "$$AIRFLOW_ADMIN_USERNAME" || airflow users create --username "$$AIRFLOW_ADMIN_USERNAME" --password "$$AIRFLOW_ADMIN_PASSWORD" --firstname Local --lastname Admin --role Admin --email local@example.invalid)
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data
    depends_on:
      qdrant:
        condition: service_healthy
    networks: [rag]

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    env_file: .env
    environment: *airflow-environment
    command: webserver
    ports:
      - "8080:8080"
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [rag]

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    env_file: .env
    environment: *airflow-environment
    command: scheduler
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [rag]

volumes:
  qdrant-data:
  ollama-data:
  airflow-data:
  model-cache:

networks:
  rag:
    driver: bridge
