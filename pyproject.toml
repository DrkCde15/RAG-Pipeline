[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Pipeline local de RAG com FastAPI, Qdrant e Ollama"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
    "pymupdf==1.25.3",
    "sentence-transformers==3.4.1",
    "torch==2.7.1+cpu",
    "qdrant-client==1.13.2",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.7", "pre-commit==4.1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: testes que dependem de serviços externos"]
